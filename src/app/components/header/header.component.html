<nav class="navbar navbar-dark bg-dark custom-navbar">
  <div class="header-flex">

    <!-- Botón de menú lateral categorías -->
    <button class="navbar-toggler" type="button" (click)="openSideMenu()">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Logo -->
    <a class="navbar-brand" routerLink="/">
      <img src="assets/images/logo.png" alt="CRC Comercial" />
    </a>

    <!-- Buscador -->
    <div class="search-wrapper">
      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input
          type="text"
          class="search-input"
          placeholder="Busca algún producto..."
          [(ngModel)]="searchText"
          (input)="filterProducts()"
          (focus)="isFocused = true"
          (blur)="isFocused = false"
        />
        <ul *ngIf="searchText && filteredProducts.length >= 0" class="suggestions-list">
          <li class="suggestion-item search-all" (click)="goToSearchResults()">
            <i class="fas fa-search me-2 text-muted"></i>
            Buscar “{{ searchText }}” en todos los productos
          </li>
          <li *ngFor="let product of filteredProducts" class="suggestion-item">
            <a (click)="goToProduct(product.id)">
              <img
                *ngIf="product.images?.length"
                [src]="'assets/images/' + product.images[0]"
                alt="{{ product.name }}"
                class="suggestion-image"
              />
              <span class="suggestion-name">{{ product.name }}</span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Carrito -->
    <div class="cart-wrapper">
      <a routerLink="/cart" class="position-relative cart-always-visible">
        <i class="fas fa-shopping-cart fa-lg cart-icon" [ngClass]="{ 'animate': isBouncing }"></i>
        <span
          *ngIf="totalItems > 0"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
          {{ totalItems }}
        </span>
      </a>
    </div>
  </div>
</nav>

<!-- Menú lateral móvil -->
<div class="side-menu-backdrop" *ngIf="sideMenuOpen" (click)="closeSideMenu()"></div>
<aside
  class="side-menu"
  *ngIf="sideMenuOpen"
  @sideMenuAnimation
>
  <div class="side-menu-header">
    <button class="close-btn" (click)="closeSideMenu()">&times;</button>
    <span class="side-menu-title">{{ sideMenuTitle }}</span>
    <button *ngIf="sideMenuStack.length > 0" class="back-btn" (click)="goBackSideMenu()">
      <i class="fas fa-chevron-left"></i>
    </button>
  </div>
  <div class="side-menu-content">
    <ul>
      <li *ngFor="let category of currentCategories">
        <button class="category-btn" (click)="openSubcategories(category)">
          {{ category.name }}
          <i *ngIf="hasSubcategories(category)" class="fas fa-chevron-right"></i>
        </button>
      </li>
      <li>
        <button class="category-btn show-all-btn" (click)="showAllCurrentCategory()">
          Mostrar todo
        </button>
      </li>
    </ul>
  </div>
</aside>
